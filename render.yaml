services:
  - type: web
    name: concurso-store
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: BASE_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true