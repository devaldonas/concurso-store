<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado - Concurso Store</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/images/concurso-store-icon.png">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <img src="/images/concurso-store-icon.png" alt="Concurso Store" class="nav-logo">
                    <span>Concurso Store</span>
                </div>
                <ul class="nav-links">
                    <li><a href="/">Início</a></li>
                    <li><a href="/#produtos">Concursos</a></li>
                    <li><a href="/success.html">Meus Pedidos</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="success-container">
            <div class="container">
                <div class="success-card">
                    <h1>Pagamento Confirmado!</h1>
                    <p class="success-message">Seu pagamento foi processado com sucesso.</p>
                    
                    <div id="orderDetails" class="order-details">
                        <p>Carregando seu material...</p>
                    </div>

                    <div class="actions">
                        <a href="/" class="btn btn-primary">Ver outros concursos</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Concurso Store. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        
        // Mapeamento de produtos para suas páginas de material
        const materialMap = {
            'memorizacao_seduc_ms': {
                nome: 'SEDUC/MS 2022',
                url: '/material/seduc-ms-2022/'
            },
            'memorizacao_pm_sp': {
                nome: 'PM/SP 2026',
                url: '/material/pm-sp-2026/'
            },
            'memorizacao_inss': {
                nome: 'INSS 2022',
                url: '/material/inss-2022/'
            },
            'memorizacao_caixa': {
                nome: 'Caixa Econômica Federal',
                url: '/material/caixa-2024/'
            },
            'memorizacao_pf': {
                nome: 'Polícia Federal',
                url: '/material/pf-2024/'
            },
            'memorizacao_tj_sp': {
                nome: 'TJ/SP',
                url: '/material/tj-sp-2024/'
            }
        };
        
        if (sessionId) {
            fetch(`/api/check-session/${sessionId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'paid') {
                        const productId = data.product_id;
                        const material = materialMap[productId] || materialMap['memorizacao_seduc_ms'];
                        const linkMaterial = `${material.url}?session_id=${sessionId}`;
                        
                        const detailsDiv = document.getElementById('orderDetails');
                        detailsDiv.innerHTML = `
                            <p><strong>Status:</strong> Pagamento confirmado</p>
                            <p><strong>Email:</strong> ${data.customer_email || 'Não informado'}</p>
                            <p><strong>Produto:</strong> ${material.nome}</p>
                            <hr style="margin: 1rem 0; border: none; border-top: 1px solid #e9ecef;">
                            <p style="margin-top: 0.8rem; color: #28a745; font-weight: bold;">
                                Seu material está disponível!
                            </p>
                            <div style="margin: 1.5rem 0; text-align: center;">
                                <a href="${linkMaterial}" 
                                   style="background: #e94560; color: white; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block;">
                                    Acessar Material - ${material.nome}
                                </a>
                            </div>
                            <p style="color: #6c757d; font-size: 0.85rem;">
                                Guarde este link para acessar seu material quando quiser.
                            </p>
                            <p style="color: #6c757d; font-size: 0.85rem; margin-top: 0.5rem;">
                                Um email com as informações também foi enviado para ${data.customer_email || 'seu email'}.
                            </p>
                        `;
                    }
                })
                .catch(error => console.error('Erro:', error));
        }
    </script>
</body>
</html>
