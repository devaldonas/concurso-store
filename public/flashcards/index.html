<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Concurso Store</title>
    <link rel="stylesheet" href="/flashcards/css/style.css">
    <link rel="icon" type="image/png" href="/images/concurso-store-icon.png">
    <style>
        .btn-voltar-material {
            display: inline-block !important;
            padding: 0.8rem 2rem !important;
            background: #6c757d !important;
            color: white !important;
            border-radius: 8px !important;
            text-decoration: none !important;
            font-weight: 600 !important;
            transition: background 0.3s !important;
            border: none !important;
            cursor: pointer !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .btn-voltar-material:hover {
            background: #5a6268 !important;
        }
        .footer-actions {
            text-align: center;
            margin-top: 2rem;
            padding: 1.5rem 0;
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .header-actions a {
            color: #e94560;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .header-actions a:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        .header-actions .btn-voltar-material-header {
            color: #6c757d;
        }
        .header-actions .btn-voltar-material-header:hover {
            background: rgba(108, 117, 125, 0.1);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Flashcards</h1>
            <div class="header-actions">
            <a href="#" id="linkVoltarMaterial" class="btn-voltar-material-header">← Voltar ao Material</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" id="app">
            <!-- Conteúdo renderizado pelo JavaScript -->
        </div>

        <!-- Botão Voltar ao Material (fora do #app, sempre visível) -->
        <div class="container">
            <div class="footer-actions">
                <a href="#" id="linkVoltarMaterialFooter" class="btn-voltar-material">
                    ← Voltar ao Material
                </a>
            </div>
        </div>
    </main>

    <script src="/flashcards/js/script.js"></script>
    <script>
        // Atualiza os links com session_id e concurso
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id') || 'dev_test';
            const concurso = urlParams.get('concurso') || 'seduc-ms-2022';

            // Atualiza todos os links "Voltar ao Material"
            const links = document.querySelectorAll('#linkVoltarMaterial, #linkVoltarMaterialFooter');
            links.forEach(link => {
                if (link) {
                    link.href = `/material/${concurso}/?session_id=${sessionId}`;
                }
            });

        });
    </script>
</body>
</html>
