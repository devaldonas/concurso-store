<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Cancelado - Concurso Store</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/images/concurso-store-icon.png">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <img src="/images/concurso-store-icon.png" alt="Concurso Store" class="nav-logo">
                    <span>Concurso Store</span>
                </div>
                <ul class="nav-links">
                    <li><a href="/">Início</a></li>
                    <li><a href="/#produtos">Concursos</a></li>
                    <li><a href="/success.html">Meus Pedidos</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="cancel-container">
            <div class="container">
                <div class="cancel-card">
                    <h1>Pagamento Cancelado</h1>
                    <p class="cancel-message">A transação foi cancelada. Nenhum valor foi cobrado.</p>
                    
                    <div class="actions">
                        <a href="/" class="btn btn-primary">Tentar novamente</a>
                        <a href="/" class="btn btn-secondary">Ver outros concursos</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Concurso Store. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>
</body>
</html>
