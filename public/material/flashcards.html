<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Concurso Store</title>
    <link rel="stylesheet" href="/flashcards/css/style.css">
    <link rel="icon" type="image/png" href="/images/concurso-store-icon.png">
    <style>
        .baralhos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .baralho-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .baralho-card:hover {
            transform: translateY(-4px);
            border-color: #e94560;
        }
        .baralho-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
        }
        .baralho-card p {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .baralho-card .qtd {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .voltar {
            display: inline-block;
            margin-top: 1rem;
            color: #e94560;
            text-decoration: none;
        }
        .voltar:hover {
            text-decoration: underline;
        }
        .header-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .header-actions a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        .header-actions a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .btn-voltar-material {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            color: white !important;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-voltar-material:hover {
            background: rgba(255,255,255,0.25);
            text-decoration: none !important;
        }
        .estudo-container {
            display: none;
        }
        .estudo-container.active {
            display: block;
        }
        .botoes-rodape {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>📚 Flashcards</h1>
            <div class="header-actions">
                <a href="/material/${CONCURSO_ID}/?session_id=${SESSION_ID}" id="linkVoltarMaterial" class="btn-voltar-material">📖 Voltar aos materiais</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" id="app">
            <!-- Conteúdo renderizado pelo JavaScript -->
        </div>
    </main>

    <script src="/flashcards/js/script.js"></script>
</body>
</html>
