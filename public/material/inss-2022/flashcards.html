<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcards - INSS 2022</title>
    <link rel="icon" type="image/png" href="/images/concurso-store-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1a1a2e;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }
        .header {
            background: #0f0f1a;
            color: white;
            padding: 1rem 0;
            border-bottom: 2px solid #e94560;
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header-actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .btn-voltar-material {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            color: white !important;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-voltar-material:hover {
            background: rgba(255,255,255,0.25);
            text-decoration: none !important;
        }

        .baralhos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .baralho-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .baralho-card:hover { transform: translateY(-4px); border-color: #e94560; }
        .baralho-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #1a1a2e; }
        .baralho-card p { color: #6c757d; font-size: 0.9rem; }
        .baralho-card .qtd {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .badge-basico { display: inline-block; background: #17a2b8; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.65rem; margin-top: 0.3rem; font-weight: 600; text-transform: uppercase; }
        .badge-especifico { display: inline-block; background: #e94560; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.65rem; margin-top: 0.3rem; font-weight: 600; text-transform: uppercase; }
        .voltar { display: inline-block; margin-top: 1rem; color: #e94560; text-decoration: none; }
        .voltar:hover { text-decoration: underline; }
        
        .footer-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }
        .btn-voltar-material-footer {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn-voltar-material-footer:hover {
            background: #c73e54;
            text-decoration: none !important;
        }
        
        footer {
            background: #0f0f1a;
            color: #c8c8d4;
            padding: 2rem 0 1rem;
            margin-top: auto;
        }
        .footer-bottom { text-align: center; opacity: 0.5; font-size: 0.75rem; }
        @media (max-width: 768px) {
            .baralhos-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.2rem; }
            .header .container { flex-direction: column; text-align: center; }
            .header-actions { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🃏 Flashcards - INSS</h1>
            <div class="header-actions">
                <a href="/material/inss-2022/?session_id=<%= session_id %>" class="btn-voltar-material">
                    📖 Voltar ao Material
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="container" id="app">
            <div style="text-align: center; padding: 2rem;">
                <p>Carregando flashcards...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Concurso Store. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        // ==========================================
        // TODOS OS 7 BARALHOS DO INSS
        // ==========================================
        const baralhos = {
            'portugues': { 
                nome: 'Língua Portuguesa', 
                arquivo: 'flashcards-portugues.csv',
                badge: 'Básico',
                badgeClass: 'badge-basico'
            },
            'constitucional': { 
                nome: 'Direito Constitucional', 
                arquivo: 'flashcards-constitucional.csv',
                badge: 'Básico',
                badgeClass: 'badge-basico'
            },
            'administrativo': { 
                nome: 'Direito Administrativo', 
                arquivo: 'flashcards-administrativo.csv',
                badge: 'Básico',
                badgeClass: 'badge-basico'
            },
            'etica': { 
                nome: 'Ética no Serviço Público', 
                arquivo: 'flashcards-etica.csv',
                badge: 'Básico',
                badgeClass: 'badge-basico'
            },
            'logica': { 
                nome: 'Raciocínio Lógico-Matemático', 
                arquivo: 'flashcards-logica.csv',
                badge: 'Básico',
                badgeClass: 'badge-basico'
            },
            'informatica': { 
                nome: 'Noções de Informática', 
                arquivo: 'flashcards-informatica.csv',
                badge: 'Básico',
                badgeClass: 'badge-basico'
            },
            'especificos': { 
                nome: 'Conhecimentos Específicos', 
                arquivo: 'flashcards-especificos.csv',
                badge: 'Específico',
                badgeClass: 'badge-especifico'
            }
        };

        // Dados embutidos (fallback caso os CSVs não carreguem)
        const dadosEmbutidos = {
            'portugues': 60,
            'constitucional': 35,
            'administrativo': 35,
            'etica': 25,
            'logica': 35,
            'informatica': 25,
            'especificos': 80
        };

        async function carregarFlashcards(baralhoId) {
            try {
                // Tenta carregar do CSV primeiro
                const response = await fetch(`/material/inss-2022/flashcards/${baralhos[baralhoId].arquivo}`);
                if (!response.ok) {
                    console.warn(`Arquivo ${baralhos[baralhoId].arquivo} não encontrado. Usando dados embutidos.`);
                    return dadosEmbutidos[baralhoId] || 0;
                }
                const text = await response.text();
                const linhas = text.split('\n').filter(line => line.trim());
                return linhas.length;
            } catch (error) {
                console.warn('Erro ao carregar:', error);
                // Fallback para dados embutidos
                return dadosEmbutidos[baralhoId] || 0;
            }
        }

        async function paginaInicial() {
            const container = document.getElementById('app');
            
            // Carrega todos os cards para contar
            let totalCards = 0;
            let totalBasico = 0;
            let totalEspecifico = 0;
            
            // Primeiro, vamos usar os dados embutidos para mostrar rápido
            let html = `
                <h2 style="margin: 1rem 0 0.5rem; color: #1a1a2e;">INSS 2022 - Técnico do Seguro Social</h2>
                <p style="color: #6c757d; margin-bottom: 0.5rem;">Conhecimentos Básicos (P1) e Específicos (P2)</p>
                <div class="baralhos-grid">
            `;
            
            let cardCounts = {};
            for (const id of Object.keys(baralhos)) {
                const count = await carregarFlashcards(id);
                cardCounts[id] = count;
                totalCards += count;
                if (baralhos[id].badge === 'Básico') totalBasico += count;
                else totalEspecifico += count;
            }
            
            for (const [id, baralho] of Object.entries(baralhos)) {
                const count = cardCounts[id] || 0;
                const status = count > 0 ? `${count} cards` : `${count} cards`;
                
                html += `
                    <div class="baralho-card" onclick="selecionarBaralho('${id}')">
                        <h3>${baralho.nome}</h3>
                        <span class="${baralho.badgeClass}">${baralho.badge}</span>
                        <p>${status}</p>
                        <span class="qtd">${count} questões</span>
                    </div>
                `;
            }
            
            html += `
                </div>
                <div style="margin-top: 2rem; padding: 1rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 1rem; text-align: center;">
                        <div>
                            <span style="font-weight: 700; font-size: 1.5rem; color: #17a2b8;">${totalBasico}</span>
                            <p style="color: #6c757d; font-size: 0.85rem;">Cards - P1 (Básicos)</p>
                        </div>
                        <div>
                            <span style="font-weight: 700; font-size: 1.5rem; color: #e94560;">${totalEspecifico}</span>
                            <p style="color: #6c757d; font-size: 0.85rem;">Cards - P2 (Específicos)</p>
                        </div>
                        <div>
                            <span style="font-weight: 700; font-size: 1.5rem; color: #1a1a2e;">${totalCards}</span>
                            <p style="color: #6c757d; font-size: 0.85rem;">Total de flashcards</p>
                        </div>
                    </div>
                </div>
                <div style="margin-top: 1rem; text-align: center; color: #6c757d; font-size: 0.9rem;">
                    <p>Clique em um baralho para começar a estudar</p>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem;">Seu progresso é salvo automaticamente</p>
                </div>
                <div class="footer-actions">
                    <a href="/material/inss-2022/?session_id=<%= session_id %>" class="btn-voltar-material-footer">
                        📖 Voltar ao Material
                    </a>
                </div>
            `;
            
            container.innerHTML = html;
        }

        function selecionarBaralho(baralhoId) {
            // Redireciona para a página de estudo com o baralho selecionado
            const sessionId = new URLSearchParams(window.location.search).get('session_id') || 'dev_test';
            window.location.href = `/material/inss-2022/study.html?baralho=${baralhoId}&session_id=${sessionId}`;
        }

        // Inicializa
        paginaInicial();

        // Exportar para uso global
        window.selecionarBaralho = selecionarBaralho;
    </script>
</body>
</html>
