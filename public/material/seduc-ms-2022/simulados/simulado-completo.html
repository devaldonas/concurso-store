<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado #1 - SEDUC/MS 2022</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            padding: 1.5rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .header p {
            opacity: 0.8;
        }
        .header .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .header .stats span {
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .grupo {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .grupo h2 {
            color: #0f0f1a;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #e94560;
        }
        .grupo .subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .questao {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 3px solid #e94560;
        }
        .questao .numero {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .questao .texto {
            margin: 0.5rem 0 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            border-left: 3px solid #6c757d;
            font-size: 0.95rem;
        }
        .questao .texto.destaque {
            border-left-color: #e94560;
            background: #fff5f5;
        }
        .alternativas {
            list-style: none;
            padding: 0;
        }
        .alternativas li {
            padding: 0.5rem 0 0.5rem 2rem;
            position: relative;
            color: #495057;
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f3f5;
        }
        .alternativas li:last-child {
            border-bottom: none;
        }
        .alternativas li::before {
            content: attr(data-letra);
            color: #e94560;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        .gabarito {
            background: #e9ecef;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
        }
        .gabarito.visible {
            display: block;
        }
        .gabarito strong {
            color: #e94560;
        }
        .btn {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 1rem 0;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #c0392b;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #1e7e34;
        }
        .btn-warning {
            background: #ffc107;
            color: #1a1a2e;
        }
        .btn-warning:hover {
            background: #e0a800;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .feedback {
            display: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-top: 0.8rem;
            font-weight: 500;
        }
        .feedback.certo {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .feedback.errado {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .progresso {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .progresso .barra {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progresso .barra-fill {
            height: 100%;
            background: #e94560;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progresso .info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #6c757d;
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .header .stats {
                gap: 0.5rem;
            }
            .header .stats span {
                font-size: 0.8rem;
                padding: 0.3rem 0.8rem;
            }
            .questao {
                padding: 1rem;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Simulado Completo #1</h1>
            <p>Secretaria de Educação - MS (Docência)</p>
            <div class="stats">
                <span>📄 80 questões</span>
                <span>⏱️ 5 horas</span>
                <span>📊 80 pontos</span>
            </div>
        </div>

        <!-- Controle de navegação -->
        <div class="progresso">
            <div class="info">
                <span id="questaoAtual">Questão 1 de 80</span>
                <span id="progressoTexto">0% concluído</span>
            </div>
            <div class="barra">
                <div class="barra-fill" id="barraProgresso" style="width: 0%"></div>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 0.8rem; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="questaoAnterior()">⬅ Anterior</button>
                <button class="btn btn-primary" onclick="proximaQuestao()">Próxima ➡</button>
                <button class="btn btn-success" onclick="mostrarGabarito()">Mostrar Gabarito</button>
            </div>
        </div>

        <div id="questoes-container">
            <!-- As questões serão inseridas aqui pelo JavaScript -->
        </div>
    </div>

    <script>
        // ============================================
        // DADOS DAS QUESTÕES (80 questões completas)
        // ============================================
        const questoes = [
            // ========================================

            // ========================================

                id: 1,
                grupo: 1,
                texto: '"A educação é a base para o desenvolvimento social e individual. Através dela, construímos cidadãos críticos."',

                alternativas: ['Objeto direto', 'Sujeito da oração', 'Predicativo do sujeito', 'Adjunto adnominal', 'Núcleo do predicado'],
                correta: 1,
                explicacao: '"Educação" é o sujeito da oração, pois é o termo sobre o qual se declara algo.'
            },
            {
                id: 2,
                grupo: 1,
                texto: '"A vida é uma jornada cheia de desafios."',

                correta: 1,
                explicacao: 'Metáfora é uma comparação implícita entre "vida" e "jornada".'

            {

                correta: 1,

            },

                correta: 1,

                    'Relação entre palavras da mesma frase',

            {

            },
            {
                id: 12,
                grupo: 1,

            {
                id: 18,
                grupo: 1,
                pergunta: 'Qual das palavras é formada por composição?',
                alternativas: ['Infeliz', 'Desleal', 'Guarda-chuva', 'Inútil', 'Desfazer'],

                explicacao: '"Guarda-chuva" é formado por composição (justaposição) de dois radicais.'

            {
                id: 19,
                grupo: 1,
                pergunta: 'O que é uma oração subordinada?',
                alternativas: [
                    'Oração independente',
                    'Oração que depende sintaticamente de outra',
                    'Oração que expressa dúvida',
                    'Oração que indica ordem',
                    'Oração que expressa desejo'

                correta: 1,
                explicacao: 'Oração subordinada é aquela que depende sintaticamente de outra oração para fazer sentido.'
            },
            {
                id: 20,
                grupo: 1,
                texto: '"Os alunos, que se prepararam bem, foram aprovados."',
                pergunta: 'A oração "que se prepararam bem" classifica-se como:',
                alternativas: ['Oração coordenada', 'Oração subordinada adjetiva', 'Oração subordinada adverbial', 'Oração subordinada substantiva', 'Oração absoluta'],
                correta: 1,
                explicacao: 'É uma oração subordinada adjetiva restritiva, especificando quais alunos foram aprovados.'

        let questaoAtual = 0;
        let respostas = {};

        function renderizarQuestao(index) {
            const q = questoes[index];
            const container = document.getElementById('questoes-container');
            
            let alternativasHtml = q.alternativas.map((alt, i) => {
                const letra = String.fromCharCode(65 + i);
                return `<li data-letra="${letra}">${alt}</li>`;
            }).join('');

            container.innerHTML = `
                <div class="grupo">
                    <h2>${q.grupo === 1 ? 'Grupo 1 - Língua Portuguesa' : q.grupo === 2 ? 'Grupo 2 - Conhecimentos Pedagógicos' : 'Grupo 3 - Conhecimentos Específicos'}</h2>
                    <div class="subtitle">Questão ${q.id} de 80</div>
                    ${q.texto ? `<div class="texto destaque">📖 ${q.texto}</div>` : ''}
                    <div class="questao">
                        <span class="numero">Questão ${q.id}</span>
                        <p style="margin: 0.5rem 0 1rem; font-weight: 500;">${q.pergunta}</p>
                        <ul class="alternativas">
                            ${alternativasHtml}
                        </ul>
                        <div class="gabarito" id="gabarito-${q.id}">
                            <strong>Gabarito:</strong> ${String.fromCharCode(65 + q.correta)} - ${q.alternativas[q.correta]}<br>
                            <span style="color: #6c757d; font-size: 0.9rem;">${q.explicacao}</span>
                        </div>
                    </div>
                </div>
            `;

            // Atualiza progresso
            document.getElementById('questaoAtual').textContent = `Questão ${index + 1} de ${questoes.length}`;
            const progresso = ((index + 1) / questoes.length * 100);
            document.getElementById('progressoTexto').textContent = `${Math.round(progresso)}% concluído`;
            document.getElementById('barraProgresso').style.width = `${progresso}%`;

            // Scroll para o topo
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function proximaQuestao() {
            if (questaoAtual < questoes.length - 1) {
                questaoAtual++;
                renderizarQuestao(questaoAtual);
            }
        }

        function questaoAnterior() {
            if (questaoAtual > 0) {
                questaoAtual--;
                renderizarQuestao(questaoAtual);
            }
        }

        function mostrarGabarito() {
            const q = questoes[questaoAtual];
            const gabarito = document.getElementById(`gabarito-${q.id}`);
            if (gabarito) {
                gabarito.classList.toggle('visible');
            }
        }

        // Inicializa
        renderizarQuestao(0);
    </script>
</body>
</html>
